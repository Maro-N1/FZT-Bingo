<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stream Bingo</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #121212;
    color: white;
    text-align: center;
    margin: 0;
    padding: 20px;
}

h1 { margin-bottom: 10px; }

#score {
    margin-bottom: 10px;
    font-size: 18px;
}

#date {
    opacity: 0.7;
    margin-bottom: 15px;
    font-size: 14px;
}

button {
    padding: 10px 15px;
    margin: 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #3cff8f;
    font-weight: bold;
}

.grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    max-width: 900px;
    margin: 20px auto;
}

.cell {
    background: #222;
    border: 2px solid #444;
    border-radius: 10px;
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    cursor: pointer;
    font-size: 12px;
    user-select: none;
}

.cell.marked {
    background: #1f8b4c;
    border-color: #3cff8f;
}
</style>
</head>

<body>

<h1>Stream Bingo</h1>
<div id="date"></div>
<div id="score">Score: 0</div>

<button onclick="newCard()">New Card</button>

<div class="grid" id="grid"></div>

<script>
const items = [
"How do I get the gray boxes?",
"Are you in a trade right now?",
"Why are your glasses so dark?",
"What are your volume profile settings?",
"Where are the gamma levels from?",
"When is the new indicator coming out?",
"Is it a daily volume profile on the right?",
"How do I join the Discord?",
"Long or short?",
"What's an IB?",
"Is the newsletter free?",
"What are the gray boxes?",
"What's GlobeEx?",
"Is Discord free?",
"What's the Tyson trade?",
"Trump is talking",
"Did you take any trades today?",
"Show your PnL"
];

let state = null;
const SIZE = 25;

function todayKey() {
    return new Date().toISOString().split("T")[0];
}

function storageKey() {
    return "streamBingo_" + todayKey();
}

function shuffle(arr) {
    return [...arr].sort(() => Math.random() - 0.5);
}

function load() {
    const saved = localStorage.getItem(storageKey());
    if (saved) return JSON.parse(saved);

    const shuffled = shuffle(items);

    const card = shuffled.slice(0, 24);
    card.splice(12, 0, "FREE SPACE");

    return {
        card,
        marked: Array(SIZE).fill(false)
    };
}

function save() {
    localStorage.setItem(storageKey(), JSON.stringify(state));
}

function render() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    state.card.forEach((text, i) => {
        const div = document.createElement("div");
        div.className = "cell";

        if (state.marked[i]) div.classList.add("marked");
        if (text === "FREE SPACE") div.classList.add("marked");

        div.textContent = text;

        div.onclick = () => {
            if (text === "FREE SPACE") return;
            state.marked[i] = !state.marked[i];
            save();
            render();
        };

        grid.appendChild(div);
    });

    updateScore();
}

function updateScore() {
    const marked = state.marked.filter(Boolean).length + 1; // +FREE SPACE
    document.getElementById("score").innerText = "Score: " + marked;
}

function newCard() {
    localStorage.removeItem(storageKey());
    state = load();
    save();
    render();
}

function init() {
    document.getElementById("date").innerText = "Today: " + todayKey();
    state = load();
    save();
    render();
}

init();
</script>

</body>
</html>
